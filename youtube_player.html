    // Global Shortcuts
    window.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA" || e.target.isContentEditable) return;

      if (e.code === "Space" || e.key === "k" || e.key === "K") {
        e.preventDefault();
        togglePlayPause();
      } else if (e.key === "j" || e.key === "J") {
        if (isPlayerReady && player) {
          const t = player.getCurrentTime();
          player.seekTo(Math.max(0, t - 10), true);
          showToast("⏪ 10초 뒤로", 1000);
        }
      } else if (e.key === "l" || e.key === "L") {
        if (isPlayerReady && player) {
          const t = player.getCurrentTime();
          player.seekTo(t + 10, true);
          showToast("⏩ 10초 앞으로", 1000);
        }
      } else if (e.key === "ArrowLeft" && !e.shiftKey) {
        e.preventDefault();
        if (isPlayerReady && player) {
          const t = player.getCurrentTime();
          player.seekTo(Math.max(0, t - 5), true);
          showToast("⏪ 5초 뒤로", 800);
        }
      } else if (e.key === "ArrowRight" && !e.shiftKey) {
        e.preventDefault();
        if (isPlayerReady && player) {
          const t = player.getCurrentTime();
          player.seekTo(t + 5, true);
          showToast("⏩ 5초 앞으로", 800);
        }
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (isPlayerReady && player) {
          const vol = Math.min(100, (player.getVolume() || 100) + 5);
          player.setVolume(vol);
          if (player.isMuted()) player.unMute();
          localStorage.setItem("yt_volume", vol);
          localStorage.setItem("yt_muted", "false");
          if (volumeSlider) volumeSlider.value = vol;
          if (muteBtn) muteBtn.innerText = vol > 50 ? "🔊" : "🔉";
          showToast(`🔊 볼륨: ${vol}%`, 800);
        }
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        if (isPlayerReady && player) {
          const vol = Math.max(0, (player.getVolume() || 100) - 5);
          player.setVolume(vol);
          localStorage.setItem("yt_volume", vol);
          if (volumeSlider) volumeSlider.value = vol;
          if (muteBtn) muteBtn.innerText = vol === 0 ? "🔇" : (vol > 50 ? "🔊" : "🔉");
          showToast(`🔉 볼륨: ${vol}%`, 800);
        }
      } else if (e.key === "f" || e.key === "F") {
        toggleFullscreen();
      } else if (e.key >= "0" && e.key <= "9") {
        if (isPlayerReady && player) {
          const pct = parseInt(e.key, 10) * 0.1;
          const dur = player.getDuration() || 0;
          if (dur > 0) {
            player.seekTo(dur * pct, true);
            showToast(`⏩ ${pct * 100}% 위치로 이동`, 1000);
          }
        }
      } else if ((e.key === "ArrowRight" && e.shiftKey) || (e.key === "N" && e.shiftKey)) {
        if (currentIndex + 1 < displayList.length) playVideoByIndex(currentIndex + 1);
      } else if ((e.key === "ArrowLeft" && e.shiftKey) || (e.key === "P" && e.shiftKey)) {
        if (currentIndex > 0) playVideoByIndex(currentIndex - 1);
      } else if (e.key === "m" || e.key === "M") {
        if (isPlayerReady && player) {
          if (player.isMuted()) {
            player.unMute();
            localStorage.setItem("yt_muted", "false");
            const v = player.getVolume() || 100;
            if (muteBtn) muteBtn.innerText = v > 50 ? "🔊" : "🔉";
            if (volumeSlider) volumeSlider.value = v;
            showToast("🔊 음소거 해제", 1000);
          } else {
            player.mute();
            localStorage.setItem("yt_muted", "true");
            if (muteBtn) muteBtn.innerText = "🔇";
            if (volumeSlider) volumeSlider.value = 0;
            showToast("🔇 음소거", 1000);
          }
        }
      } else if (e.key === "t" || e.key === "T") {
        toggleSidebar();
      } else if (e.key === "[" || e.key === "]") {
        const speeds = [0.75, 1, 1.25, 1.5, 1.75, 2];
        let currentRate = parseFloat(speedSelect.value) || 1;
        let curIdx = speeds.indexOf(currentRate);
        if (curIdx === -1) curIdx = 1;
        if (e.key === "[") {
          curIdx = Math.max(0, curIdx - 1);
        } else {
          curIdx = Math.min(speeds.length - 1, curIdx + 1);
        }
        const newRate = speeds[curIdx];
        speedSelect.value = String(newRate);
        if (isPlayerReady && player && typeof player.setPlaybackRate === "function") {
          player.setPlaybackRate(newRate);
        }
        showToast(`⚡ 재생 속도: ${newRate}x`, 1000);
      } else if (e.key === "w" || e.key === "W") {
        document.getElementById("toggle-watched-btn")?.click();
      }
    });

    // Channel Add / Search Modal
    const modal = document.getElementById("channel-modal");

    const searchResultsContainer = document.getElementById("channel-search-results");
    const modalSearchBtn = document.getElementById("modal-search-btn");

    function escapeText(str) {
      if (!str) return "";
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    document.getElementById("add-channel-btn").addEventListener("click", () => {
      modal.style.display = "flex";
      channelInput.value = "";

    function closeChannelModal() {
      modal.style.display = "none";

      searchResultsContainer.innerHTML = "";
      searchResultsContainer.style.display = "none";
    }

    document.getElementById("modal-cancel-btn").addEventListener("click", closeChannelModal);

    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeChannelModal();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modal.style.display === "flex") {
        closeChannelModal();
      }

    async function executeChannelSearch() {
      const q = channelInput.value.trim();
      if (!q) {
        modalStatus.className = "status-msg error";
        modalStatus.innerText = "채널 이름이나 키워드를 입력해 주세요.";
        return;
      }

      // If user directly entered a URL
      if (q.startsWith("http://") || q.startsWith("https://")) {
        loadAndApplyChannel(q);
        return;
      }

      modalStatus.className = "status-msg loading";
      modalStatus.innerText = `'${q}' 연관 채널을 검색하는 중입니다...`;
      searchResultsContainer.style.display = "none";
      searchResultsContainer.innerHTML = "";

      try {
        const res = await fetch(`/api/search_channels?q=${encodeURIComponent(q)}`);
        const data = await res.json();

        if (data.success && data.channels && data.channels.length > 0) {
          modalStatus.className = "status-msg";
          modalStatus.innerText = `검색 결과 ${data.channels.length}개 (원하는 채널을 클릭하세요):`;
          renderSearchResults(data.channels);
        } else {
          modalStatus.className = "status-msg error";
          modalStatus.innerText = `'${q}'에 대한 채널을 찾을 수 없습니다. 다른 키워드로 검색해 보세요.`;
        }
      } catch (err) {
        modalStatus.className = "status-msg error";
        modalStatus.innerText = "채널 검색 중 오류 발생: " + err.message;
      }
    }

    function renderSearchResults(channelsList) {
      searchResultsContainer.innerHTML = "";
      channelsList.forEach(ch => {
        const card = document.createElement("div");
        card.className = "channel-result-card";
        const thumbUrl = ch.thumbnail || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44' fill='%23555'><rect width='44' height='44' rx='22'/></svg>";
        card.innerHTML = `
          <img class="channel-result-thumb" referrerpolicy="no-referrer" src="${thumbUrl}" alt="" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'44\\' height=\\'44\\' fill=\\'%23555\\'><rect width=\\'44\\' height=\\'44\\' rx=\\'22\\'/></svg>'">
          <div class="channel-result-info">
            <div class="channel-result-name">${escapeText(ch.title)}</div>
            <div class="channel-result-meta">
              <span>${escapeText(ch.subscribers || "구독자 정보 없음")}</span>
              ${ch.handle ? `<span>•</span><span>${escapeText(ch.handle)}</span>` : ""}
            </div>
          </div>
          <button class="channel-result-btn">선택</button>
        `;
        card.addEventListener("click", () => {
          loadAndApplyChannel(`https://www.youtube.com/channel/${ch.channelId}/videos`, ch.title, ch.subscribers);
        });
        searchResultsContainer.appendChild(card);
      });
      searchResultsContainer.style.display = "flex";
    }

    async function loadAndApplyChannel(targetUrl, channelNameHint = "", subscribersHint = "") {
      modalStatus.className = "status-msg loading";
      modalStatus.innerText = `${channelNameHint ? `'${channelNameHint}'` : "채널"} 동영상 목록을 가져오는 중입니다...`;
      searchResultsContainer.style.display = "none";

      try {
        const res = await fetch(`/api/fetch_channel?url=${encodeURIComponent(targetUrl)}`);
        const data = await res.json();

        if (data.success && data.data && data.data.videos && data.data.videos.length > 0) {
          const newCh = {
            id: data.data.channelId || ("ch_" + Date.now()),
            name: data.data.channelName || channelNameHint || "새 채널",
            url: data.data.channelUrl || targetUrl,
            playlistId: data.data.playlistId || "",
            subscribers: data.data.subscribers || subscribersHint || "",
            videos: data.data.videos
          };

          const existingIdx = channels.findIndex(c => c.id === newCh.id);
          if (existingIdx >= 0) {
            channels[existingIdx] = newCh;
          } else {
            channels.push(newCh);
          }

          saveChannels();
          updateChannelDropdown();
          switchChannel(newCh);

          modalStatus.className = "status-msg success";
          modalStatus.innerText = `성공! '${newCh.name}' 채널 동영상 ${newCh.videos.length}개를 불러왔습니다.`;
          setTimeout(() => {
            closeChannelModal();
          }, 700);
        } else {
          modalStatus.className = "status-msg error";
          modalStatus.innerText = (data && data.error) ? data.error : "동영상을 찾을 수 없습니다.";
        }
      } catch (err) {
        modalStatus.className = "status-msg error";
        modalStatus.innerText = "동영상 불러오기 오류: " + err.message;
      }
    }

    modalSearchBtn.addEventListener("click", executeChannelSearch);
    channelInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        executeChannelSearch();
      }
    });

    // Real-time check and sync for newly uploaded videos in current channel
    let isSyncing = false;
    async function syncChannelLatestVideos(silent = false) {
      if (!currentChannel || !currentChannel.id || isSyncing) return;
      isSyncing = true;
      const syncBtn = document.getElementById("sync-latest-btn");
      if (syncBtn) syncBtn.innerText = "🔄 동기화중";

      try {
        const resp = await fetch(`/api/sync_latest_videos?channel_id=${encodeURIComponent(currentChannel.id)}`);
        const data = await resp.json();
        if (data.success) {
          if (data.subscribers) {
            currentChannel.subscribers = data.subscribers;
            const statSub = document.getElementById("stat-subscribers");
            if (statSub) statSub.innerText = `👥 ${data.subscribers}`;
          }

          if (data.latestVideos && Array.isArray(data.latestVideos) && data.latestVideos.length > 0) {
            const existingIds = new Set(currentChannel.videos.map(v => v.id));
            const newVideos = data.latestVideos.filter(v => !existingIds.has(v.id));

            if (newVideos.length > 0) {
              // Prepend newly found videos to currentChannel.videos
              currentChannel.videos = [...newVideos, ...currentChannel.videos];
              // Re-index
              currentChannel.videos.forEach((v, idx) => {
                v.originalIndex = idx + 1;
              });

              saveChannels();
              prepareList();
              updateCurrentPlayingTitle();
              updateResumeBanner();
              updateChannelDropdown();
              showToast(`🎉 새로운 영상 ${newVideos.length}개가 실시간으로 추가되었습니다!`, 3500);
            } else if (!silent) {
              showToast("✅ 최신 영상이 모두 동기화되어 있습니다.", 2000);
            }
          }
        } else if (!silent) {
          showToast("최신 영상 확인 중 문제가 발생했습니다.", 2000);
        }
      } catch (err) {
        if (!silent) showToast("서버 연결 실패", 2000);
      } finally {
        isSyncing = false;
        if (syncBtn) syncBtn.innerText = "🔄 최신";
      }
    }

    const syncLatestBtn = document.getElementById("sync-latest-btn");
    if (syncLatestBtn) {
      syncLatestBtn.addEventListener("click", () => syncChannelLatestVideos(false));
    }

    // Initialize UI
    updateOrderButtons();
    updateMembershipFilterButtons();
    updateChannelDropdown();
    let savedScreenMode = localStorage.getItem("binge_screen_mode");
    if (savedScreenMode === "normal") {
      try { localStorage.removeItem("binge_screen_mode"); } catch(e) {}
      savedScreenMode = "large";
    }
    setMode(savedScreenMode || "large");

    // 1. Prepare list directly (automatically matches last watched video by ID, respecting order & filters)
    prepareList(true);

    // 2. Open directly with the last watched video at the very top of the list
    if (currentChannel && displayList.length > 0) {
      playVideoByIndex(currentIndex, true);
    }
    // 4. Background sync channels from server if available
    if (window.location.protocol.startsWith("http")) {
      fetch("/api/channels")
        .then(r => r.json())
        .then(res => {
          if (res.success && Array.isArray(res.channels) && res.channels.length > 0) {
            let changed = false;
            for (const sCh of res.channels) {
              sCh.id = sCh.id || sCh.channelId;
              sCh.name = sCh.name || sCh.channelName || "채널";
              const localIdx = channels.findIndex(c => (c.id || c.channelId) === sCh.id);
              if (localIdx === -1) {
                channels.push(sCh);
                changed = true;
              } else if (sCh.videos && sCh.videos.length > 0 && (sCh.videos.length !== channels[localIdx].videos.length || (channels[localIdx].videos[0] && sCh.videos[0].id !== channels[localIdx].videos[0].id))) {
                channels[localIdx] = sCh;
                if (currentChannel && (currentChannel.id || currentChannel.channelId) === sCh.id) {
                  currentChannel = sCh;
                  prepareList();
                  updateCurrentPlayingTitle();
                  updateResumeBanner();
                }
                changed = true;
              }
            }
            if (!currentChannel && channels.length > 0) {
              const target = (res.activeChannelId && channels.find(c => c.id === res.activeChannelId)) || channels[0];
              switchChannel(target);
              changed = true;
            } else if (res.activeChannelId && currentChannel) {
              const target = channels.find(c => c.id === res.activeChannelId);
              if (target && target.id !== currentChannel.id) {
                switchChannel(target);
                changed = true;
              }
            }
            if (changed) {
              localStorage.setItem("binge_channels", JSON.stringify(channels));
              updateChannelDropdown();
            }
          }
        })
        .catch(() => {});
    }

    // 5. Background check for new uploads in real-time
    setTimeout(() => {
      syncChannelLatestVideos(true);
    }, 1500);
  </script>
</body>
</html>
